name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'packages/movehat/src/**'
      - 'packages/movehat/typedoc.json'
      - 'packages/movehat/scripts/postprocess-typedoc.mjs'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Allow only one concurrent deployment, skipping older queued runs.
concurrency:
  group: 'docs-deploy'
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build movehat (TypeDoc prebuild needs dist/)
        run: pnpm build:movehat

      - name: Build docs site
        run: pnpm build:docs
        env:
          # Custom domain served at root (CNAME = movehat.org). No basePath
          # needed; the assetPrefix/basePath defaults from next.config.mjs
          # apply when MOVEHAT_DOCS_BASE_PATH is unset.
          NEXT_PUBLIC_MOVEHAT_DOCS_SITE_URL: https://movehat.org

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
