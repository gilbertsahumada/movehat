name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'packages/movehat/src/**'
      - 'packages/movehat/typedoc.json'
      - 'packages/movehat/scripts/postprocess-typedoc.mjs'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

# Opt the pinned JS actions into the Node 24 runtime ahead of GitHub's
# 2026-06-16 forced switch. GitHub's recommended opt-in; no version change.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# Allow only one concurrent deployment, skipping older queued runs.
concurrency:
  group: 'docs-deploy'
  cancel-in-progress: false

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          # docs-deploy never pushes back to the repo (Pages upload uses
          # OIDC, not git push), so persisting GITHUB_TOKEN is unnecessary
          # token exposure. See CodeRabbit #265 + zizmor 'artipacked'.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build movehat (TypeDoc prebuild needs dist/)
        run: pnpm build:movehat

      - name: Build docs site
        run: pnpm build:docs
        env:
          # Custom domain served at root (CNAME = movehat.org). No basePath
          # needed; the assetPrefix/basePath defaults from next.config.mjs
          # apply when MOVEHAT_DOCS_BASE_PATH is unset.
          NEXT_PUBLIC_MOVEHAT_DOCS_SITE_URL: https://movehat.org

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: packages/docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
