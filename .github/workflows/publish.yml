name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.0.1)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update package version
        run: |
          cd packages/movehat
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version

      - name: Replace workspace:* in template with actual version
        run: |
          cd packages/movehat/src/templates
          sed -i 's/"movehat": "workspace:[*]"/"movehat": "^${{ steps.get_version.outputs.version }}"/' package.json
          echo "Template package.json updated"
          cat package.json

      - name: Run tests
        run: pnpm test:smoke

      - name: Build package
        run: pnpm build:movehat

      - name: Verify build output
        run: |
          cd packages/movehat
          if [ ! -d "dist" ]; then
            echo "ERROR: Build output directory 'dist' not found"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "ERROR: Main build file 'dist/index.js' not found"
            exit 1
          fi
          echo "Build verification passed"
          ls -la dist/

      - name: Publish to npm
        run: |
          cd packages/movehat
          VERSION=${{ steps.get_version.outputs.version }}

          # If version is alpha/beta/rc , publish with tag
          if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"-beta"* || "$VERSION" == *"-rc"* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump back to repository
        if: github.event_name == 'release'
        run: |
          set -e  # Exit on any error

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the version changes before switching branches
          git add packages/movehat/package.json packages/movehat/src/templates/package.json
          git stash push -m "Version bump to ${{ steps.get_version.outputs.version }}"

          # Fetch and checkout main branch (exit detached HEAD state)
          git fetch origin main
          git checkout main

          # Rebase onto latest main to avoid non-fast-forward rejections
          echo "Rebasing onto latest main..."
          if ! git pull --rebase origin main; then
            echo "ERROR: Failed to rebase onto main. Main branch may have advanced with conflicting changes."
            git rebase --abort || true
            exit 1
          fi

          # Apply the stashed version changes
          echo "Applying version bump changes..."
          if ! git stash pop; then
            echo "ERROR: Failed to apply stashed changes. There may be merge conflicts."
            git stash drop || true
            exit 1
          fi

          # Commit the version bump
          git add packages/movehat/package.json packages/movehat/src/templates/package.json
          if ! git diff --cached --quiet; then
            echo "Committing version bump..."
            if ! git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }} [skip ci]"; then
              echo "ERROR: Failed to commit version bump."
              exit 1
            fi
          else
            echo "No changes to commit (version already up to date)"
            exit 0
          fi

          # Push to main branch
          echo "Pushing to main branch..."
          if ! git push origin main; then
            echo "ERROR: Failed to push to main. This could be due to:"
            echo "  - Non-fast-forward rejection (main advanced after rebase)"
            echo "  - Permission issues"
            echo "  - Network issues"
            exit 1
          fi

          echo "Successfully pushed version bump to main"

      - name: Commit version bump and create tag (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e  # Exit on any error

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure we're on main branch
          echo "Checking out main branch..."
          git fetch origin main
          git checkout main

          # Rebase onto latest main
          echo "Rebasing onto latest main..."
          if ! git pull --rebase origin main; then
            echo "ERROR: Failed to rebase onto main"
            git rebase --abort || true
            exit 1
          fi

          # Commit version changes
          git add packages/movehat/package.json packages/movehat/src/templates/package.json
          if ! git diff --cached --quiet; then
            echo "Committing version bump..."
            if ! git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }} [skip ci]"; then
              echo "ERROR: Failed to commit version bump"
              exit 1
            fi
          else
            echo "No changes to commit (version already up to date)"
          fi

          # Create and push tag
          echo "Creating tag v${{ steps.get_version.outputs.version }}..."
          git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"

          # Push both commit and tag
          echo "Pushing commit and tag to remote..."
          if ! git push origin main; then
            echo "ERROR: Failed to push to main"
            exit 1
          fi
          if ! git push origin "v${{ steps.get_version.outputs.version }}"; then
            echo "ERROR: Failed to push tag"
            exit 1
          fi

          echo "Successfully pushed version bump and tag to repository"
