name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.0.1)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Upgrade npm to >= 11.5.1 for Trusted Publishers
        # OIDC + provenance only ship in npm >= 11.5.1; Node 20 bundles ~10.x.
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install

      - name: Get and validate version
        id: get_version
        # F10c: every later step interpolates this version directly into
        # shell (npm version, sed, VERSION=, git commit, git tag, git push).
        # Two guards here:
        #   1. Read both raw inputs via `env:` so a poisoned
        #      `release.tag_name` or `workflow_dispatch.inputs.version`
        #      can never break out of THIS step's shell — it sits in a
        #      env var, not inline `${{ }}` interpolation.
        #   2. Apply strict semver regex (after stripping a leading `v`
        #      from release tags) before emitting the step output.
        #      Anything that doesn't match fails the workflow before
        #      any downstream consumer sees the value.
        env:
          MOVEHAT_RAW_RELEASE_TAG: ${{ github.event.release.tag_name }}
          MOVEHAT_RAW_DISPATCH_VERSION: ${{ github.event.inputs.version }}
          MOVEHAT_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$MOVEHAT_EVENT_NAME" = "release" ]; then
            VERSION="${MOVEHAT_RAW_RELEASE_TAG#v}"  # Remove 'v' prefix if present
          else
            VERSION="$MOVEHAT_RAW_DISPATCH_VERSION"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Resolved version '$VERSION' is not strict semver (expected e.g. 0.2.1 or 0.2.1-rc.1)."
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update package version
        # `--allow-same-version` lets the step no-op when the manifest is
        # already at the release tag (version bump landed in a prior PR).
        run: |
          cd packages/movehat
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Verify CHANGELOG section exists for release version
        # Blocks publish if package.json version lacks a `## [X.Y.Z]` entry
        # in CHANGELOG.md. Runs after `npm version` so it sees the final value.
        run: node packages/movehat/scripts/check-changelog.js

      - name: Replace workspace:* in template with actual version
        run: |
          cd packages/movehat/src/templates
          sed -i 's/"movehat": "workspace:[*]"/"movehat": "^${{ steps.get_version.outputs.version }}"/' package.json
          echo "Template package.json updated"
          cat package.json

      - name: Run unit tests
        run: pnpm --filter movehat test

      - name: Run integration suite (zero-mock)
        run: pnpm --filter movehat test:integration
        env:
          MOVEMENT_RPC_URL: https://testnet.movementnetwork.xyz/v1
          # `movement node run-local-testnet` aborts during MintFunder setup
          # on Linux x86_64; harness-local is gated, harness-fork still runs.
          MOVEHAT_SKIP_LOCAL_NODE: 'true'

      - name: Run smoke tests
        run: pnpm test:smoke

      - name: Build package
        run: pnpm build:movehat

      - name: Verify build output
        run: |
          cd packages/movehat
          if [ ! -d "dist" ]; then
            echo "ERROR: Build output directory 'dist' not found"
            exit 1
          fi
          if [ ! -f "dist/index.js" ]; then
            echo "ERROR: Main build file 'dist/index.js' not found"
            exit 1
          fi
          echo "Build verification passed"
          ls -la dist/

      - name: Publish to npm (Trusted Publishers + provenance)
        # Authenticates via GitHub Actions OIDC (`id-token: write`).
        # Requires a Trusted Publisher configured on npmjs.com for movehat.
        # No NPM_TOKEN secret consumed.
        run: |
          cd packages/movehat
          VERSION=${{ steps.get_version.outputs.version }}

          # If version is alpha/beta/rc, publish with the `next` tag
          if [[ "$VERSION" == *"-alpha"* || "$VERSION" == *"-beta"* || "$VERSION" == *"-rc"* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

      - name: Commit version bump back to repository
        if: github.event_name == 'release'
        run: |
          set -e  # Exit on any error

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Closes #174: skip cleanly when main already has the version
          # bump (the typical flow: release PR landed the bump before
          # the tag was created, so the tag's `package.json` and
          # `origin/main`'s `package.json` agree on version, and there's
          # literally nothing to commit back).
          #
          # The previous unconditional `git stash push → checkout main →
          # rebase → stash pop` dance produced "No stash entries found"
          # when there was no diff to stash, then failed on pop and
          # failed the whole job — even though npm publish (the actual
          # job purpose) had already succeeded.
          git fetch origin main
          TAG_VERSION=$(grep -m1 '"version"' packages/movehat/package.json \
            | sed 's/.*"version": "\([^"]*\)".*/\1/')
          MAIN_VERSION=$(git show origin/main:packages/movehat/package.json \
            | grep -m1 '"version"' \
            | sed 's/.*"version": "\([^"]*\)".*/\1/')

          if [ "$TAG_VERSION" = "$MAIN_VERSION" ]; then
            echo "main is already at v$TAG_VERSION; no commit-back needed."
            exit 0
          fi

          echo "main is at v$MAIN_VERSION; tag is v$TAG_VERSION. Committing bump back..."

          # Below: original stash/rebase/pop dance — preserved for the
          # edge case where a tag was created from a commit whose
          # version bump never landed on main (e.g., release created
          # from a feature branch).

          # Stash the version changes before switching branches
          git add packages/movehat/package.json packages/movehat/src/templates/package.json
          git stash push -m "Version bump to ${{ steps.get_version.outputs.version }}"

          # Fetch and checkout main branch (exit detached HEAD state)
          git checkout main

          # Rebase onto latest main to avoid non-fast-forward rejections
          echo "Rebasing onto latest main..."
          if ! git pull --rebase origin main; then
            echo "ERROR: Failed to rebase onto main. Main branch may have advanced with conflicting changes."
            git rebase --abort || true
            exit 1
          fi

          # Apply the stashed version changes
          echo "Applying version bump changes..."
          if ! git stash pop; then
            echo "ERROR: Failed to apply stashed changes. There may be merge conflicts."
            git stash drop || true
            exit 1
          fi

          # Commit the version bump
          git add packages/movehat/package.json packages/movehat/src/templates/package.json
          if ! git diff --cached --quiet; then
            echo "Committing version bump..."
            if ! git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }} [skip ci]"; then
              echo "ERROR: Failed to commit version bump."
              exit 1
            fi
          else
            echo "No changes to commit (version already up to date)"
            exit 0
          fi

          # Push to main branch
          echo "Pushing to main branch..."
          if ! git push origin main; then
            echo "ERROR: Failed to push to main. This could be due to:"
            echo "  - Non-fast-forward rejection (main advanced after rebase)"
            echo "  - Permission issues"
            echo "  - Network issues"
            exit 1
          fi

          echo "Successfully pushed version bump to main"

      - name: Commit version bump and create tag (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -e  # Exit on any error

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure we're on main branch
          echo "Checking out main branch..."
          git fetch origin main
          git checkout main

          # Rebase onto latest main
          echo "Rebasing onto latest main..."
          if ! git pull --rebase origin main; then
            echo "ERROR: Failed to rebase onto main"
            git rebase --abort || true
            exit 1
          fi

          # Commit version changes
          git add packages/movehat/package.json packages/movehat/src/templates/package.json
          if ! git diff --cached --quiet; then
            echo "Committing version bump..."
            if ! git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }} [skip ci]"; then
              echo "ERROR: Failed to commit version bump"
              exit 1
            fi
          else
            echo "No changes to commit (version already up to date)"
          fi

          # Create and push tag
          echo "Creating tag v${{ steps.get_version.outputs.version }}..."
          git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"

          # Push both commit and tag
          echo "Pushing commit and tag to remote..."
          if ! git push origin main; then
            echo "ERROR: Failed to push to main"
            exit 1
          fi
          if ! git push origin "v${{ steps.get_version.outputs.version }}"; then
            echo "ERROR: Failed to push tag"
            exit 1
          fi

          echo "Successfully pushed version bump and tag to repository"
