name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

# Opt the pinned JS actions into the Node 24 runtime ahead of GitHub's
# 2026-06-16 forced switch (the actions still run on Node 20 otherwise and
# emit deprecation warnings). This is GitHub's recommended opt-in; it does not
# change the action versions, so there is no breaking-change risk.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build and type check
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and formatting gates
        run: |
          pnpm lint
          pnpm format:check

      - name: Reject circular dependencies
        run: pnpm cycles

      - name: TypeScript type check
        run: cd packages/movehat && pnpm tsc --noEmit

      - name: Build
        run: pnpm build:movehat

      - name: Verify reviewed public API surface
        run: pnpm api:check

      - name: Check npm package contents
        run: pnpm --filter movehat run check-pack-contents

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: build-artifacts
          path: packages/movehat/dist/
          retention-days: 1

  docs:
    name: Documentation Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package and documentation
        run: |
          pnpm build:movehat
          pnpm build:docs

  # Unit tests with coverage
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage-report
          path: packages/movehat/coverage/
          retention-days: 7

      - name: Check coverage threshold
        run: |
          cd packages/movehat
          if [ ! -f "coverage/coverage-summary.json" ]; then
            echo "::error::coverage/coverage-summary.json not found; cannot enforce threshold."
            exit 1
          fi
          LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Line coverage: $LINES%"
          # Per-file thresholds (≥80% on critical modules) are enforced by
          # vitest via coverage.thresholds; this is the global safety net.
          if (( $(echo "$LINES < 70" | bc -l) )); then
            echo "Coverage is below 70% threshold!"
            exit 1
          fi

  # Test matrix across Node versions
  test-matrix:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    strategy:
      matrix:
        node: ['20', '22']
      fail-fast: false

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: build-artifacts
          path: packages/movehat/dist/

      - name: Build
        run: pnpm build:movehat

      - name: Run unit tests
        run: pnpm test

  # E2E tests + integration suite
  e2e-tests:
    name: Example, Movelite & Testnet Gates
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: build-artifacts
          path: packages/movehat/dist/

      - name: Cache Movement CLI binary
        id: cache-movement-cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ${{ runner.temp }}/movement
          # SHA256 prefixes tie cache hits to the pinned tarball and binary.
          # The "bin" namespace avoids restoring older /usr/local/bin caches
          # that predate binary-level SHA verification.
          key: movement-cli-bin-${{ runner.os }}-${{ runner.arch }}-f2bdf3fa-1101983b

      - name: Add Movement CLI to PATH
        run: echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Movement CLI
        if: steps.cache-movement-cli.outputs.cache-hit != 'true'
        env:
          # Pinned SHA256 of `movement-cli-l1-linux-x86_64.tar.gz` from the
          # `bypass-homebrew` moving tag. Upstream re-uploads silently, so
          # SHA256 is the only stable version pin. Rotation: update this
          # value consciously when adopting a new upstream build.
          MOVEMENT_CLI_SHA256_LINUX_X64: f2bdf3fa82e6b49c83c91be0967640282e1759e66b237440709a8779a9f9c1b2
        run: |
          # Map runner.arch to the artifact suffix the upstream release uses.
          # The cache key (above) already includes runner.arch, so the
          # download URL must follow the same arch dimension or a cache hit
          # on the wrong architecture would install an unusable binary.
          case "${{ runner.arch }}" in
            X64)   CLI_ARCH="x86_64"; EXPECTED_SHA256="${MOVEMENT_CLI_SHA256_LINUX_X64}" ;;
            ARM64) echo "::error::aarch64 SHA256 not pinned"; exit 1 ;;
            *)     echo "::error::Unsupported runner.arch: ${{ runner.arch }}"; exit 1 ;;
          esac
          ARTIFACT="movement-cli-l1-linux-${CLI_ARCH}.tar.gz"
          curl -fLO "https://github.com/movementlabsxyz/homebrew-movement-cli/releases/download/bypass-homebrew/${ARTIFACT}"
          # Verify SHA256 before chmod/sudo mv. Mismatch means upstream
          # silently re-uploaded; rotate the pin above and retry.
          echo "${EXPECTED_SHA256}  ${ARTIFACT}" | sha256sum -c
          mkdir -p temp_extract
          tar -xzf "${ARTIFACT}" -C temp_extract
          chmod +x temp_extract/movement
          mv temp_extract/movement "$RUNNER_TEMP/movement"
          rm -rf temp_extract "${ARTIFACT}"

      - name: Verify Movement CLI
        env:
          MOVEMENT_CLI_BINARY_SHA256_LINUX_X64: 1101983bddae0e8f810d3a4b8e2b0f04d00f91ee5eb7f1cdefa3f93ad77ee1fa
        run: |
          case "${{ runner.arch }}" in
            X64)   EXPECTED_BINARY_SHA256="${MOVEMENT_CLI_BINARY_SHA256_LINUX_X64}" ;;
            ARM64) echo "::error::aarch64 binary SHA256 not pinned"; exit 1 ;;
            *)     echo "::error::Unsupported runner.arch: ${{ runner.arch }}"; exit 1 ;;
          esac
          echo "${EXPECTED_BINARY_SHA256}  ${RUNNER_TEMP}/movement" | sha256sum -c
          movement --version

      - name: Run clean-install smoke test
        # This installs a candidate tarball into an isolated prefix and may
        # resolve user-template dependencies from npm. Advisory + main-only:
        # external npm resolution must not gate a develop PR.
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: bash scripts/smoke-test.sh

      - name: Run E2E tests
        # Advisory + main-only: drives the CLI against live public testnet.
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: pnpm test:e2e:quick
        env:
          MOVEMENT_RPC_URL: https://testnet.movementnetwork.xyz/v1

      - name: Run integration suite (zero-mock)
        # Advisory + main-only: the fork test reads live public testnet.
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main'
        run: pnpm test:integration
        env:
          MOVEMENT_RPC_URL: https://testnet.movementnetwork.xyz/v1
          # `movement node run-local-testnet` aborts during MintFunder setup
          # on Linux x86_64 (ENOT_APTOS_FRAMEWORK_ADDRESS in delegate-mint).
          # Skip harness-local in CI; harness-fork + grep-guard still gate.
          MOVEHAT_SKIP_LOCAL_NODE: 'true'

      - name: Guard — no vi.mock in integration suite
        # Belt-and-suspenders defense against a future PR that adds
        # vi.mock under test/integration/ and coincidentally has the
        # mock-driven path pass without ever touching the real CLI.
        # Runs AFTER the integration suite so a single failing local
        # iteration does not re-run the (longer) suite twice.
        run: |
          if grep -rE "vi\.mock|vi\.spyOn" packages/movehat/test/integration/; then
            echo "::error::Integration suite contains vi.mock or vi.spyOn — zero-mock invariant violated."
            exit 1
          fi

      - name: movelite backend gate (#302)
        # First time the example's deploy loop runs on Linux CI: the full
        # Movement node can't start here (MintFunder bug — see MOVEHAT_SKIP_LOCAL_NODE
        # above), but movelite can. pnpm install pulled movelite-linux-x64
        # (movehat's optionalDependency); this asserts it spawns and deploys
        # via the SDK path. The Movement CLI installed above provides the
        # `movement move build` compile step.
        run: MOVEHAT_EXPECT_BACKEND=movelite pnpm assert-backend
        env:
          MOVEMENT_RPC_URL: https://testnet.movementnetwork.xyz/v1
          # A cold GitHub runner boots movelite (plus the probe's deploy) in
          # ~25-30s; the 20s local-dev default flakes here. 60s keeps a
          # meaningful ceiling — the slow Movement node fallback is minutes —
          # while the backend-identity assertion still catches a wrong backend.
          MOVEHAT_EXPECT_BOOT_MAX_MS: '60000'

      - name: Canonical deploy gate (test:runtime, #397)
        # Required local gate for the flagship credential-free deploy flow:
        # runs the example's deploy-counter.ts against the implicit movelite
        # backend (local-by-default, no PRIVATE_KEY, no external network).
        # Exit code 0 is necessary but not sufficient — the terminal
        # "Counter value: 1" line is emitted only after deploy + init +
        # increment + view all succeed, so the grep asserts the script
        # actually reached the end of the flow.
        run: |
          set -o pipefail
          pnpm test:runtime 2>&1 | tee runtime.log
          grep -q "Counter value: 1" runtime.log

      - name: Fork migration & serve gate (#398)
        # Required offline gate for the fork subsystem: drives the real CLI
        # against the checked-in genuine 0.6.0 fork fixture and asserts the
        # legacy-cache migration, a cached resource read, and the fork
        # server's HTTP responses. Every asserted path is a local cache
        # hit — no network, no keys — so it can gate every PR.
        run: pnpm test:fork-e2e

      - name: Example suite (Tier 2 gate — movelite backend)
        # The counter-example mocha suite is all-local: the fixtures share
        # one implicit movelite node (pulled by pnpm install as movehat's
        # optionalDependency) and the Movement CLI installed above compiles
        # the Move packages.
        # The movement-node mode (MOVEHAT_USE_MOVELITE=0) stays deferred to
        # the Linux MintFunder issue (#149), same as MOVEHAT_SKIP_LOCAL_NODE
        # above.
        run: pnpm test:example
        env:
          MOVEMENT_RPC_URL: https://testnet.movementnetwork.xyz/v1

  # Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check package.json
        # Validation logic lives in packages/movehat/scripts/check-package-json.js
        # (ESM). Extracted from an inline `node -e` block that tripped the
        # workflow validation hook on every ci.yml edit.
        run: node packages/movehat/scripts/check-package-json.js

      - name: Check for TODO/FIXME comments
        run: |
          if grep -r "TODO\|FIXME" packages/movehat/src --exclude-dir=node_modules --exclude-dir=dist; then
            echo "Warning: TODO/FIXME comments found (this won't fail the build)"
          fi
        continue-on-error: true

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d  # v3.0.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        # `pnpm audit` operates workspace-wide and cannot scope to a
        # single package. Non-critical findings can include docs-site
        # transitive dependencies and workspace tooling, so this gate is
        # intentionally critical-only until accepted non-critical
        # advisories are tracked in SECURITY.md.
        #
        # Pragmatic gate: critical-level CVEs in production dependency
        # paths hard-fail this step; lower severities require explicit
        # documentation or remediation before acceptance.
        run: pnpm audit --prod --audit-level critical
        # F10a (audit): production-dependency vulnerabilities at
        # critical severity hard-fail. Anything below critical that
        # affects the published package must be documented in
        # SECURITY.md before being accepted.
