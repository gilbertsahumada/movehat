name: CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Build and type check
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type check
        run: cd packages/movehat && pnpm tsc --noEmit

      - name: Build
        run: pnpm build:movehat

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: packages/movehat/dist/
          retention-days: 1

  # Unit tests with coverage
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/movehat/coverage/
          retention-days: 7

      - name: Check coverage threshold
        run: |
          cd packages/movehat
          if [ ! -f "coverage/coverage-summary.json" ]; then
            echo "::error::coverage/coverage-summary.json not found; cannot enforce threshold."
            exit 1
          fi
          LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Line coverage: $LINES%"
          # Fail if coverage is below 15% (baseline; raise as tests grow)
          if (( $(echo "$LINES < 15" | bc -l) )); then
            echo "Coverage is below 15% threshold!"
            exit 1
          fi

  # Test matrix across Node versions
  test-matrix:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        node: ['20', '22']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages/movehat/dist/

      - name: Build
        run: pnpm build:movehat

      - name: Run unit tests
        run: pnpm test

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh

  # E2E tests (only on PRs to main)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages/movehat/dist/

      - name: Install Movement CLI
        run: |
          curl -fLO https://github.com/movementlabsxyz/homebrew-movement-cli/releases/download/bypass-homebrew/movement-cli-l1-linux-x86_64.tar.gz
          mkdir -p temp_extract
          tar -xzf movement-cli-l1-linux-x86_64.tar.gz -C temp_extract
          chmod +x temp_extract/movement
          sudo mv temp_extract/movement /usr/local/bin/movement
          rm -rf temp_extract movement-cli-l1-linux-x86_64.tar.gz
          movement --version

      - name: Run E2E tests
        run: pnpm test:e2e:quick
        env:
          MOVEMENT_RPC_URL: https://testnet.movementnetwork.xyz/v1

  # Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check package.json
        run: |
          cd packages/movehat
          node -e "
            const pkg = require('./package.json');
            const required = ['name', 'version', 'description', 'author', 'license', 'repository', 'bin'];
            const missing = required.filter(f => !pkg[f]);
            if (missing.length) {
              console.error('Missing required fields:', missing);
              process.exit(1);
            }
          "

      - name: Check for TODO/FIXME comments
        run: |
          if grep -r "TODO\|FIXME" packages/movehat/src --exclude-dir=node_modules --exclude-dir=dist; then
            echo "Warning: TODO/FIXME comments found (this won't fail the build)"
          fi
        continue-on-error: true

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        run: pnpm audit --prod
        continue-on-error: true
