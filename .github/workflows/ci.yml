name: CI

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # Build and type check
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: TypeScript type check
        run: cd packages/movehat && pnpm tsc --noEmit

      - name: Build
        run: pnpm build:movehat

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: packages/movehat/dist/
          retention-days: 1

  # Unit tests with coverage
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/movehat/coverage/
          retention-days: 7

      - name: Check coverage threshold
        run: |
          cd packages/movehat
          if [ ! -f "coverage/coverage-summary.json" ]; then
            echo "::error::coverage/coverage-summary.json not found; cannot enforce threshold."
            exit 1
          fi
          LINES=$(jq '.total.lines.pct' coverage/coverage-summary.json)
          echo "Line coverage: $LINES%"
          # M3.5 raised the floor from 15% to 70%. Per-file thresholds for
          # the 16 M3 target files (≥80%) are enforced by vitest itself
          # via coverage.thresholds in vitest.config.ts — this gate is
          # the global safety net for helper/UI modules outside that list.
          if (( $(echo "$LINES < 70" | bc -l) )); then
            echo "Coverage is below 70% threshold!"
            exit 1
          fi

  # Test matrix across Node versions
  test-matrix:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    strategy:
      matrix:
        node: ['20', '22']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages/movehat/dist/

      - name: Build
        run: pnpm build:movehat

      - name: Run unit tests
        run: pnpm test

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh

  # E2E tests + integration suite (every push, M4.2)
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build, unit-tests]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: packages/movehat/dist/

      - name: Cache Movement CLI binary
        id: cache-movement-cli
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/movement
          key: movement-cli-${{ runner.os }}-${{ runner.arch }}-bypass-homebrew-l1
          restore-keys: |
            movement-cli-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Movement CLI
        if: steps.cache-movement-cli.outputs.cache-hit != 'true'
        run: |
          # Map runner.arch to the artifact suffix the upstream release uses.
          # The cache key (above) already includes runner.arch, so the
          # download URL must follow the same arch dimension or a cache hit
          # on the wrong architecture would install an unusable binary.
          case "${{ runner.arch }}" in
            X64)   CLI_ARCH="x86_64" ;;
            ARM64) CLI_ARCH="aarch64" ;;
            *)     echo "::error::Unsupported runner.arch: ${{ runner.arch }}"; exit 1 ;;
          esac
          ARTIFACT="movement-cli-l1-linux-${CLI_ARCH}.tar.gz"
          curl -fLO "https://github.com/movementlabsxyz/homebrew-movement-cli/releases/download/bypass-homebrew/${ARTIFACT}"
          mkdir -p temp_extract
          tar -xzf "${ARTIFACT}" -C temp_extract
          chmod +x temp_extract/movement
          sudo mv temp_extract/movement /usr/local/bin/movement
          rm -rf temp_extract "${ARTIFACT}"

      - name: Verify Movement CLI
        run: movement --version

      - name: Run E2E tests
        run: pnpm test:e2e:quick
        env:
          MOVEMENT_RPC_URL: https://testnet.movementnetwork.xyz/v1

      - name: Run integration suite (zero-mock)
        run: pnpm test:integration
        env:
          MOVEMENT_RPC_URL: https://testnet.movementnetwork.xyz/v1
          # See #149 — `movement node run-local-testnet` fails during
          # MintFunder setup on Linux x86_64 (Move abort:
          # ENOT_APTOS_FRAMEWORK_ADDRESS during delegate-mint). Until
          # upstream lands a fix, skip the harness-local lifecycle in
          # CI; the harness-fork tests + grep-guard step below still
          # gate, and macOS / WSL developers run the full suite locally.
          MOVEHAT_SKIP_LOCAL_NODE: 'true'

      - name: Guard — no vi.mock in integration suite
        # Belt-and-suspenders defense against a future PR that adds
        # vi.mock under test/integration/ and coincidentally has the
        # mock-driven path pass without ever touching the real CLI.
        # Runs AFTER the integration suite so a single failing local
        # iteration does not re-run the (longer) suite twice.
        run: |
          if grep -rE "vi\.mock|vi\.spyOn" packages/movehat/test/integration/; then
            echo "::error::Integration suite contains vi.mock or vi.spyOn — zero-mock invariant violated."
            exit 1
          fi

  # Code quality checks
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check package.json
        run: |
          cd packages/movehat
          node -e "
            const pkg = require('./package.json');
            const required = ['name', 'version', 'description', 'author', 'license', 'repository', 'bin'];
            const missing = required.filter(f => !pkg[f]);
            if (missing.length) {
              console.error('Missing required fields:', missing);
              process.exit(1);
            }
          "

      - name: Check for TODO/FIXME comments
        run: |
          if grep -r "TODO\|FIXME" packages/movehat/src --exclude-dir=node_modules --exclude-dir=dist; then
            echo "Warning: TODO/FIXME comments found (this won't fail the build)"
          fi
        continue-on-error: true

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Audit dependencies
        run: pnpm audit --prod
        continue-on-error: true
